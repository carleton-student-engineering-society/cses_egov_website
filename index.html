<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSES Governance</title>
    <!-- Tailwind via CDN to completely avoid extra CSS build modules -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="./css/styles.css">
  </head>
  <body class="bg-white min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-gray-200">
      <div class="text-2xl font-bold text-gray-900">Logo</div>
      <button id="upload-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium text-sm transition-colors cursor-pointer">
        ↑ upload
      </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center pt-20 px-4">
      <h1 class="text-4xl md:text-5xl font-semibold text-gray-800 mb-8">
        CSES Governance
      </h1>

      <!-- Search Bar -->
      <div class="w-full max-w-xl mb-12">
        <input
          type="text"
          id="search-input"
          placeholder="🔍 Search"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-900 shadow-sm"
        />
      </div>

      <!-- Divider Line -->
      <div class="w-full border-t border-gray-200"></div>
    </main>

    <!-- Load TypeScript Entry Point -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
